name: Update auction data and deploy

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Update mode
        required: true
        default: full
        type: choice
        options:
          - full
          - names-only

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: auction-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect court auctions, analysis data, and geocoding
        if: github.event_name != 'workflow_dispatch' || inputs.mode != 'names-only'
        run: npm run collect:auctions
        env:
          NAVER_MAP_CLIENT_ID: ${{ secrets.NAVER_MAP_CLIENT_ID }}
          NAVER_MAP_CLIENT_SECRET: ${{ secrets.NAVER_MAP_CLIENT_SECRET }}

      - name: Enrich unresolved apartment names with NAVER
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'names-only'
        run: node scripts/auction/enrich-apartment-names.mjs
        env:
          NAVER_MAP_CLIENT_ID: ${{ secrets.NAVER_MAP_CLIENT_ID }}
          NAVER_MAP_CLIENT_SECRET: ${{ secrets.NAVER_MAP_CLIENT_SECRET }}

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_NAVER_MAP_CLIENT_ID: ${{ secrets.NAVER_MAP_CLIENT_ID }}

      - name: Commit collected data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/auctions.json data/auction-state.json data/geocode-cache.json data/document-cache/documents.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "data: update court auctions"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
